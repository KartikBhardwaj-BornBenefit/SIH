<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>DigiLocker</title>
  </head>
  <body>
    <header>
      <a href="#en">English</a>
      <a href="#hi">Hindi</a>
      <a href="#gu">Gujarati</a>
      <a href="#bn">Bengali</a>
      <a href="#mr">Marathi</a>
      <a href="#as">Assamese</a>
      <a href="#or">Odia</a>
      <a href="#pa">Punjabi</a>
      <a href="#ta">Tamil</a>
      <a href="#te">Telugu</a>
      <a href="#kn">Kannada</a>
      <a href="#ml">Malayalam</a>
    </header>
    <main>
      <div class="card">
        <p>Verified</p>
        <div class="title">Enter 6 digit security PIN</div>
        <div class="pin-row">
          <div class="cell"><input type="password" maxlength="1" autocomplete="one-time-code" inputmode="numeric"></div>
          <div class="cell"><input type="password" maxlength="1" autocomplete="one-time-code" inputmode="numeric"></div>
          <div class="cell"><input type="password" maxlength="1" autocomplete="one-time-code" inputmode="numeric"></div>
          <div class="cell"><input type="password" maxlength="1" autocomplete="one-time-code" inputmode="numeric"></div>
          <div class="cell"><input type="password" maxlength="1" autocomplete="one-time-code" inputmode="numeric"></div>
          <div class="cell"><input type="password" maxlength="1" autocomplete="one-time-code" inputmode="numeric"></div>
        </div>
        <p><a href="#forgot">Forgot security PIN?</a></p>
        <button type="button">Continue</button>
      </div>
    </main>
  </body>
</html>
