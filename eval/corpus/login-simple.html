<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Sign in</title>
  </head>
  <body>
    <h1>Sign in</h1>
    <form>
      <label id="ls-l1" for="ls-1">Username</label>
      <input id="ls-1" name="username" type="text" autocomplete="username">

      <label id="ls-l2" for="ls-2">Password</label>
      <input id="ls-2" name="password" type="password" autocomplete="current-password">

      <label id="ls-l3" for="ls-3">One-time code</label>
      <input id="ls-3" name="otp" type="text" autocomplete="one-time-code">

      <button id="ls-4" type="button">Sign in</button>
      <a id="ls-5" href="/reset">Reset your password</a>
    </form>
  </body>
</html>
