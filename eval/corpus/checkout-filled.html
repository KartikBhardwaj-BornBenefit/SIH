<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Checkout review</title>
  </head>
  <body>
    <h1>Checkout review</h1>
    <form>
      <label id="cf-l1" for="cf-1">Card number</label>
      <input id="cf-1" name="cardnumber" type="text" autocomplete="cc-number" value="5523 4567 8901 2342">

      <label id="cf-l2" for="cf-2">CVV</label>
      <input id="cf-2" name="cvv" type="text" autocomplete="cc-csc" value="123">

      <label id="cf-l3" for="cf-3">Expiry</label>
      <input id="cf-3" name="ccexp" type="text" autocomplete="cc-exp" value="12/28">

      <label id="cf-l4" for="cf-4">Nickname for this card</label>
      <input id="cf-4" name="label" type="text" value="Travel card">

      <button id="cf-5" type="button">Confirm</button>
    </form>
  </body>
</html>
