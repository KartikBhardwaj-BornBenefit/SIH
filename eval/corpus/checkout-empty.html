<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Checkout</title>
  </head>
  <body>
    <h1>Checkout</h1>
    <form>
      <label id="ce-l1" for="ce-1">Card number</label>
      <input id="ce-1" name="cardnumber" type="text" autocomplete="cc-number">

      <label id="ce-l2" for="ce-2">CVV</label>
      <input id="ce-2" name="cvv" type="text" autocomplete="cc-csc">

      <label id="ce-l3" for="ce-3">Expiry</label>
      <input id="ce-3" name="ccexp" type="text" autocomplete="cc-exp">

      <label id="ce-l4" for="ce-4">Nickname for this card</label>
      <input id="ce-4" name="label" type="text">

      <label id="ce-l5" for="ce-6">Street address</label>
      <input id="ce-6" name="address-line1" type="text" autocomplete="address-line1">

      <label id="ce-l6" for="ce-7">PIN code</label>
      <input id="ce-7" name="pincode" type="text" autocomplete="postal-code">

      <button id="ce-5" type="button">Pay now</button>
    </form>
  </body>
</html>
